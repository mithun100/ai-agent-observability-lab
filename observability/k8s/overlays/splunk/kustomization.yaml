apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: travel-observability
resources:
  - ../../base

configMapGenerator:
  - name: otel-collector-config
    files:
      - collector-config.yaml=../../../collector/profiles/collector-config.splunk.yaml

secretGenerator:
  - name: collector-exporter-secrets
    literals:
      - SPLUNK_ACCESS_TOKEN=replace-me
      - SPLUNK_REALM=us1
      - SPLUNK_HEC_TOKEN=replace-me
      - SPLUNK_HEC_ENDPOINT=https://http-inputs-example.splunkcloud.com/services/collector
      - SPLUNK_HEC_INDEX=main

generatorOptions:
  disableNameSuffixHash: true
